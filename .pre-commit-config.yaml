# Run on every commit:
#   pre-commit install
# Update hook versions:
#   pre-commit autoupdate
# Run against the whole repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # ESPHome YAML uses !secret/!lambda tags; let pre-commit accept them.
        args: [--unsafe]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: \.md$

  # Python: lint + format the component's __init__.py and any scripts.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # C++: enforce the ESPHome style (matches .clang-format in this repo).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        types_or: [c++, c]
