# Build-only smoke: ESP32-S3 + ESP-IDF + rtsp_audio (local external component).

esphome:
  name: smoke-rtsp-s3
  min_version: 2024.11.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: "test_wifi"
  password: "test_passw"

external_components:
  - source:
      type: local
      path: ../../../components
    components: [rtsp_audio]

i2s_audio:
  id: i2s_mic
  i2s_lrclk_pin: GPIO12
  i2s_bclk_pin: GPIO13
  i2s_mclk_pin: GPIO14

microphone:
  - platform: i2s_audio
    id: demo_mic
    i2s_audio_id: i2s_mic
    adc_type: external
    i2s_din_pin: GPIO15
    sample_rate: 32000
    bits_per_sample: 16bit
    channel: right

rtsp_audio:
  microphone:
    microphone: demo_mic

binary_sensor:
  - platform: rtsp_audio
    client_connected:
      name: "RTSP client connected"

text_sensor:
  - platform: rtsp_audio
    client_ip:
      name: "RTSP client IP"

sensor:
  - platform: rtsp_audio
    bytes_sent:
      name: "RTSP bytes sent"
    cpu_use_pct:
      name: "CPU use"
    peak_level_dbfs:
      name: "Peak level"
    limiter_gain_reduction_db:
      name: "Limiter gain reduction"

number:
  - platform: rtsp_audio
    low_cut_frequency_hz:
      name: "Low cut frequency"
    high_cut_frequency_hz:
      name: "High cut frequency"
    gain_db:
      name: "Audio gain"
    soft_limiter_threshold_db:
      name: "Soft limiter threshold"
    soft_limiter_attack_ms:
      name: "Soft limiter attack"
    soft_limiter_release_ms:
      name: "Soft limiter release"

switch:
  - platform: rtsp_audio
    soft_limiter_enabled:
      name: "Soft limiter"
