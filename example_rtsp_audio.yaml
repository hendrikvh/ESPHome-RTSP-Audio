esphome:
  name: rtsp-audio
  friendly_name: RTSP Audio

esp32:
  board: lolin_s2_mini
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_secret

external_components:
  - source:
      type: git
      url: https://github.com/hendrikvh/ESPHome-RTSP-Audio
      ref: main
    components: [ rtsp_audio ]

i2s_audio:
  id: i2s_inmp441
  i2s_lrclk_pin: GPIO11   # INMP441 WS
  i2s_bclk_pin: GPIO9     # INMP441 SCK

microphone:
  - platform: i2s_audio
    id: mic_inmp441
    i2s_audio_id: i2s_inmp441
    adc_type: external
    i2s_din_pin: GPIO12   # INMP441 SD
    sample_rate: 32000
    bits_per_sample: 16bit
    channel: left

rtsp_audio:
  id: rtsp_mic
  microphone:
    microphone: mic_inmp441
  port: 554
  packet_ms: 20

# Optional diagnostic sensors.
# See docs/configuration.md#diagnostic-sensors for the full reference.
binary_sensor:
  - platform: rtsp_audio
    client_connected:
      name: "RTSP client connected"

text_sensor:
  - platform: rtsp_audio
    client_ip:
      name: "RTSP client IP"

sensor:
  - platform: rtsp_audio
    bytes_sent:
      name: "RTSP bytes sent"
    # CPU headroom indicator. See docs/configuration.md#reading-cpu_use_pct.
    cpu_use_pct:
      name: "CPU use"
    # Post-gain peak meter for setting the gain_db slider below.
    # See docs/configuration.md#reading-peak_level_dbfs.
    peak_level_dbfs:
      name: "Peak level"

# Optional sliders in Home Assistant for the low-cut / high-cut filters and
# the audio gain. All persist across reboots.
# See docs/configuration.md#audio-processing for ranges, defaults, and
# tuning guidance.
number:
  - platform: rtsp_audio
    low_cut_frequency_hz:
      name: "Low cut frequency"
    high_cut_frequency_hz:
      name: "High cut frequency"
    gain_db:
      name: "Audio gain"
