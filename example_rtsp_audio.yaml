esphome:
  name: rtsp-audio
  friendly_name: RTSP Audio

esp32:
  board: lolin_s2_mini
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_secret

external_components:
  - source:
      type: git
      url: https://github.com/hendrikvh/ESPHome-RTSP-Audio
      ref: v0.0.1
    components: [ rtsp_audio ]

i2s_audio:
  id: i2s_inmp441
  i2s_lrclk_pin: GPIO11   # INMP441 WS
  i2s_bclk_pin: GPIO9     # INMP441 SCK

microphone:
  - platform: i2s_audio
    id: mic_inmp441
    i2s_audio_id: i2s_inmp441
    adc_type: external
    i2s_din_pin: GPIO12   # INMP441 SD
    sample_rate: 32000
    bits_per_sample: 16bit
    channel: left

rtsp_audio:
  id: rtsp_mic
  microphone:
    microphone: mic_inmp441
  port: 554
  packet_ms: 20

# Optional diagnostic sensors
binary_sensor:
  - platform: rtsp_audio
    client_connected:
      name: "RTSP client connected"

text_sensor:
  - platform: rtsp_audio
    client_ip:
      name: "RTSP client IP"

sensor:
  - platform: rtsp_audio
    bytes_sent:
      name: "RTSP bytes sent"
    # CPU-use headroom indicator. <30 % plenty of headroom; 30-70 % normal;
    # 70-90 % running hot (consider disabling features); sustained >90 %
    # (or 100 %) means upgrade the chip (e.g. ESP32-S2 -> ESP32-S3) or back
    # off DSP / sample rate.
    cpu_use_pct:
      name: "CPU use"

# Optional sliders in Home Assistant. All persist across reboots.
#   - low_cut_frequency_hz: low-cut filter cutoff in Hz, default 100.
#     Raise it in noisier rooms or for non-voice sources.
#   - high_cut_frequency_hz: high-cut filter cutoff in Hz, default
#     16000 (off — at Nyquist for our 32 kHz audio, bit-identical
#     passthrough). Lower it to roll off hiss or out-of-band content.
#     Range 1000 to 16000 Hz.
#   - gain_db: input gain in decibels, default 0 dB (bit-identical
#     passthrough). Range -20 to +40 dB. Saturating clamp on overflow;
#     never wraps.
number:
  - platform: rtsp_audio
    low_cut_frequency_hz:
      name: "Low cut frequency"
      unit_of_measurement: "Hz"
    high_cut_frequency_hz:
      name: "High cut frequency"
      unit_of_measurement: "Hz"
    gain_db:
      name: "Audio gain"
      unit_of_measurement: "dB"
